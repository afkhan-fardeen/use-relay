# Render Blueprint: Klyroo (free web service)
# Note: the service keeps its original name "userelay"; renaming it here would create a second service.
# Secrets are NOT stored here. Render prompts for each `sync: false` value on first deploy.
# NEXT_PUBLIC_* values are baked in at BUILD time: after changing one, trigger a new deploy.
services:
  - type: web
    name: userelay
    runtime: node
    plan: free
    region: singapore        # closest Render region to the Supabase project (Tokyo)
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Site
      - key: NEXT_PUBLIC_SITE_URL
        value: https://useklyroo.com
      - key: ADMIN_EMAILS
        value: afkhan.fardeen@gmail.com
      # Supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Security
      - key: MASTER_KEY
        sync: false
      - key: TICK_SECRET
        sync: false
      # Billing (Dodo Payments). Switch to live_mode only after Dodo verification is approved.
      - key: DODO_PAYMENTS_ENVIRONMENT
        value: test_mode
      - key: DODO_PAYMENTS_API_KEY
        sync: false
      - key: DODO_PAYMENTS_WEBHOOK_KEY
        sync: false
      - key: DODO_PRODUCT_EXPORT_STARTER
        value: pdt_0NrPysHU8uVpSOa3QYvBu
      - key: DODO_PRODUCT_EXPORT_GROWTH
        value: pdt_0NrPysMqaQnbNS1r8CcyJ
      - key: DODO_PRODUCT_EXPORT_SCALE
        value: pdt_0NrPysRTfFH5RCfQp0Qgs
      - key: DODO_PRODUCT_QR_PRO
        value: pdt_0NrPysV3156gQDM6BtqGi
      - key: DODO_PRODUCT_QR_BUSINESS
        value: pdt_0NrPysZFeKUzcVdJWLp5A
      # Support form: emails support@useklyroo.com through Resend (requests are saved either way)
      - key: RESEND_API_KEY
        sync: false
      # Optional, cookie-free analytics (Plausible): your site domain
      - key: NEXT_PUBLIC_PLAUSIBLE_DOMAIN
        value: ""
      # Optional: Slack/Discord incoming webhook for server error alerts
      - key: ERROR_WEBHOOK_URL
        sync: false
